# yaml-language-server: $schema=https://raw.githubusercontent.com/markbac/code-quality/main/fwlens/config.schema.json
# fwlens configuration
# Copy this file to config.yaml and edit for your project.

# Paths: every input path below (project.*, tool.libclang_path, tool.sysroot,
# tool.system_include_dirs, standards.*) is relative to the directory containing this file.
# Absolute paths and ~ work as written. The exception is output.*, which is relative to the
# directory you run fwlens from. `fwlens doctor` prints each resolved path.

# Tool settings
tool:
  # Full path to libclang.dll (Windows).
  # Install LLVM from https://github.com/llvm/llvm-project/releases
  # then point this at the DLL in the LLVM bin directory.
  # Optional. Leave unset to use LIBCLANG_PATH or the libclang bundled with FWLens.
  # An explicit path that does not exist is an error.
  # libclang_path: C:\LLVM\bin\libclang.dll

  # clang target. Default arm-none-eabi. Use "native" for host builds (no --target,
  # headers from the host gcc/cc/clang). Compile-database flags (-target, -std, -m*)
  # override these per file.
  # target: arm-none-eabi
  # sysroot: /opt/arm/sysroot
  # system_include_dirs: [/usr/include]   # skips auto-detection when set
  # clang_args: ["-std=c11"]
  # auto_detect_includes: true            # ask the compiler where its headers are
  # parse_error_threshold: 0.0            # used by --fail-on-parse-error
  # jobs: 0                               # parse workers (0 = CPUs minus one); --jobs/-j overrides
  # parse_timeout: 120                    # seconds per source file, 0 = no limit; --timeout overrides
  # parse_cache: true                     # reuse unchanged files from output.cache_dir; --no-cache disables

# Project settings
project:
  # --- Option A: IAR Embedded Workbench (.ewp) ---
  ewp: ..\iar\Project.ewp
  configuration: Debug
  proj_dir: C:\Projects\Project\iar
  toolkit_dir: C:\Program Files\IAR Systems\Embedded Workbench 9.6\arm

  # Linker map for flash/RAM footprint (GCC-style map lines). Optional.
  # map_file: build/project.map

  # Directory mode: which directories go on the include path.
  #   include_dirs: [inc, ports/arm_cm4]   # explicit, in search order (picks one port)
  #   include_mode: all                    # all (every header directory) | used (only #include'd ones)

  # --- Option A2: Keil uVision or STM32CubeIDE / Eclipse CDT ---
  # uvprojx: MDK-ARM/project.uvprojx     # configuration: = the Keil target name
  # cproject: .cproject                  # configuration: = the build configuration (Debug)

  # --- Option B: CMake & Make compile_commands.json ---
  # Set compile_commands (or set mode: cmake / make / compile_commands) to read
  # a compilation database generated by CMake (`cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON`),
  # or Make (`bear -- make`, `compiledb make`).
  #
  # compile_commands: build/compile_commands.json
  # mode: cmake   # or 'make' / 'compile_commands'

  # --- Option C: Directory mode (no build file) ---
  # Set project.source_dir instead of project.ewp / compile_commands to analyse
  # a plain folder of .c/.h files -- fwlens will recursively glob *.c under
  # this directory.
  #
  # source_dir: C:\Projects\some-library

# Boundary classification
# Files under these paths (relative to proj_dir) are classified as first_party.
# Everything else found in the .ewp is third_party_lib or sdk.
scope:
  first_party:
    - Src
    - Inc
  sdk:
    - sdk
  third_party_lib:
    - Lib

  # Analysis runs on first_party only by default.
  # Set to [first_party, third_party_lib, sdk] to analyse everything.
  analyse: [first_party]

  # Directory mode only: files and directories to leave out of the scan. Each entry is a
  # glob matched against the path relative to project.source_dir, or against the bare name.
  # .git, build, __pycache__, .cache, node_modules and .pytest_cache are always skipped.
  # exclude: ["test/*", "*_generated.c"]

# IAR compatibility defines injected into every libclang translation unit.
# These prevent parse failures on IAR-specific syntax.
iar_compat_defines:
  - __ICCARM__=1
  - __arm__=1
  - __ARM_ARCH=7
  - __ARM_ARCH_7EM__=1
  - __CORE__=7
  - __intrinsic=
  - __root=
  - __ramfunc=
  - __interrupt=
  - __irq=
  - __fiq=
  - __swi=
  - __nested=
  - __monitor=
  - __nounwind=
  - __noreturn=
  - __task=
  - __weak=
  - __stackless=
  - __cmse_nonsecure_entry=
  - __cmse_nonsecure_call=
  - "__packed="
  - "__aligned(x)="
  - "__section(x)="
  - "__no_init="
  # IAR's compiler treats `static_assert` as always available, without needing
  # <assert.h> included first (C11's static_assert is a macro from that header, not a
  # keyword, until C23) -- clang doesn't, so any header that uses static_assert without
  # including assert.h itself parses fine under IAR but fails under fwlens's clang-based
  # parse. This makes it globally available the same way IAR does, regardless of which
  # (if any) translation unit happens to include assert.h. See the guide's Project-wide
  # auto-stub section for the full story -- this was the actual fix for a cascade of
  # "unknown type name" / "expected ')'" errors that looked unrelated to static_assert
  # at first glance, in files that never mentioned it directly.
  - "static_assert=_Static_assert"

# Function names treated as assertion calls for assert-coverage metrics. Optional --
# defaults to assert/ASSERT/PSP_ASSERT/STATIC_ASSERT/_Static_assert/static_assert
# (plus OS_Error automatically when rtos.kind is "embos" -- see the RTOS section
# below: embOS's OS_ASSERT is a macro that expands to `if (!cond) OS_Error(code)`,
# so it never appears as its own call in the AST; detecting the call it expands
# into is the only way to see it). Add your own project's assert/error macro name
# here if it's neither of those.
# assert_names: [assert, ASSERT, MyProjectAssert]

# Architecture layers
# Each layer has a name and a list of IAR group names or path fragments that belong to it.
# The first matching rule wins. Files that match no rule are placed in 'Unknown'.
layers:
  - name: SDK
    paths: [sdk]
  - name: ThirdParty
    paths: [Lib]
  - name: BSP
    groups: [drivers, emdrv, rtc, uart, isr]
  - name: RTOS
    groups: [rtos, os, tick, sched, idle]
  - name: Middleware
    groups: [LwM2MClient, ModemMgr, ModemStates, internicheStack, internichedtls, slip, lwM2MStack]
  - name: Services
    groups: [Prepayment, ValveControl, OptoComms, batteryLife, FWUpgrade]
  - name: Application
    groups: [BaseMeter, UiFSM, Autotest, e2emulation]

# Metric thresholds
# Breaches are flagged in console output and highlighted in the HTML report.
thresholds:
  cyclomatic_complexity: 15
  cognitive_complexity: 20
  halstead_effort: 1000000
  halstead_volume: 8000
  block_depth: 5
  function_loc: 100
  parameter_count: 6
  return_path_count: 5
  magic_number_density: 0.15
  fan_out: 10
  instability_zone_of_pain: 0.3      # I < this AND A < 0.3 = zone of pain
  instability_zone_of_uselessness: 0.7  # I > this AND A > 0.7 = zone of uselessness
  main_sequence_distance: 0.5        # |A + I - 1| > this = flagged
  cohesion_min: 0.3                  # internal call cohesion below this = low cohesion

# Known entry points -- excluded from dead code detection
entry_points:
  - main
  # Add task entry function names here, e.g.:
  # - AppTask
  # - ModemTask
  # - PrepaymentTask

# Output
output:
  # These paths are relative to the directory you run fwlens from (not the config file).
  reports_dir: output/reports
  exports_dir: output/exports
  cache_dir: output/.cache
  db_path: output/fwlens.db

  # Formats to produce on 'report' command. Add 'plots' for standalone PNG charts,
  # 'diagrams' for Mermaid architecture + dependency SVG, 'sarif' for SARIF findings,
  # 'sbom' for a CycloneDX software bill of materials, 'cbom' for a cryptography bill of materials.
  formats: [html, csv, json]

  # Files longer than this many lines are not embedded in the HTML source viewer.
  # source_embed_loc_limit: 10000
  # show_timing: true                 # print where the run time went when a command ends

  # Number of top offenders to show in console summary.
  top_n: 20

# Git-based hotspot analysis (churn x structural debt). Optional -- if proj_dir/source_dir
# isn't inside a git repository, or git isn't on PATH, hotspot analysis is skipped.
# git:
#   since: "180 days ago"   # default: full history
#   heatmap_bin: "month"    # or "week" -- bin size for churn_heatmap.png
#   # Commit-message keywords (case-insensitive) that classify a commit as a "fix" --
#   # used by reliability growth, defect correlation/root-cause, and bug-fix-weighted
#   # hotspots. Override if your commit conventions differ from English fix/bug/defect/...
#   # (e.g. a ticket-only convention, or a non-English team).
#   fix_keywords: [fix, bug, defect, issue, resolve, patch, hotfix]

# Cost-benefit estimate of static analysis (the unit costs it uses).
# cost_benefit:
#   cost_per_defect_static_usd: 100     # cost to fix a defect found by static analysis
#   cost_per_defect_field_usd: 1000     # cost to fix the same defect after release

# COCOMO effort/schedule estimate. Optional -- defaults to "embedded" mode.
# estimation:
#   cocomo_mode: embedded   # organic | semidetached | embedded

# RTOS task/synchronisation analysis. Optional -- disabled by default (kind: none).
# Only embOS is implemented, verified against the real embOS V5.18.3.0 RTOS.h --
# the defaults below need no overrides for a standard embOS install. If your project
# uses a different embOS version, spot-check the extracted priorities/stacks once
# after enabling this (via `report`'s RTOS tab or `rtos_tasks.csv`) before trusting it.
# rtos:
#   kind: embos
#   # Only needed if your code calls task-creation functions under different names,
#   # or the argument order genuinely differs from OS_TASK_Create/OS_TASK_CreateEx:
#   # task_functions:
#   #   OS_TASK_Create:   {tcb: 0, name: 1, priority: 2, routine: 3, stack: 4, stack_size: 5}
#   #   OS_TASK_CreateEx: {tcb: 0, name: 1, priority: 2, routine: 3, stack: 4, stack_size: 5}
#   # semaphore_functions: [OS_SEMAPHORE_Create]
#   # mutex_functions: [OS_MUTEX_Create]
#   # mailbox_functions: [OS_MAILBOX_Create]
#   # queue_functions: [OS_QUEUE_Create]
#   # event_functions: [OS_EVENT_Create, OS_EVENT_CreateEx]
#   # rwlock_functions: [OS_RWLOCK_Create]
#   # A called function whose name contains one of these (case-insensitive) is a wait or a signal;
#   # signal is checked first:
#   # wait_keywords: [Wait, Get, Receive, Take, Lock, Blocked]
#   # signal_keywords: [Give, Put, Send, Unlock, Set, Pulse]
#   # usage_functions: [OS_SEMAPHORE_TakeBlocked, OS_SEMAPHORE_Give, OS_MUTEX_LockBlocked, ...]
#   #
#   # If tasks are defined as a static const array of descriptor structs and created
#   # generically in a loop (common pattern -- one OS_TASK_Create call site with
#   # pTask->field arguments, not one literal call per task), task_functions alone
#   # can't recover per-task data (name/priority/entry fn all vary at runtime, not
#   # at the call site). Add the struct type name and its member-name mapping here
#   # instead -- fwlens reads the array's initializer directly:
#   # task_table_types:
#   #   YourTaskEntryStructName:
#   #     tcb: tcb                  # struct member holding the OS_TASK* / TCB
#   #     name: name                # struct member holding the task name string
#   #     priority: priority        # struct member holding the OS_PRIO
#   #     routine: taskFn           # struct member holding the entry function pointer
#   #     stack: stack               # struct member holding the stack array pointer
#   #     stack_size: stackSize     # struct member holding the stack size
#   #
#   # For an RTOS whose creation functions return the handle via RETURN VALUE
#   # instead of an output-pointer argument (FreeRTOS: `q = xQueueCreate(...)`,
#   # as opposed to embOS's `OS_MUTEX_Create(&mutex, ...)`), list those function
#   # names here so fwlens reads the assignment target instead of args[0] --
#   # example for FreeRTOS (kind: freertos has no built-in defaults yet, so all
#   # of the lists above need to be set explicitly too):
#   # queue_functions: [xQueueCreate]
#   # semaphore_functions: [xSemaphoreCreateBinary]
#   # mutex_functions: [xSemaphoreCreateMutex]
#   # usage_functions: [xQueueSend, xQueueReceive, xSemaphoreTake, xSemaphoreGive]
#   # return_value_functions: [xQueueCreate, xSemaphoreCreateBinary, xSemaphoreCreateMutex]

# Optional coding-standard checks (MISRA C, CERT C, BARR-C, AUTOSAR, TS 17961, Power of 10, FWLens). Off unless enabled. See FWLENS_GUIDE.md.
# standards:
#   enabled:
#     - standard: misra-c-2012
#       include_categories: [mandatory, required]
#     - standard: cert-c
#     - standard: power-of-10
#     - standard: misra-c-2023
#     - standard: barr-c-2018
#     - standard: autosar-cpp14      # AUTOSAR C++14 guidelines that apply to C
#     - standard: iso-ts-17961       # ISO/IEC TS 17961 C secure coding
#     - standard: fwlens             # secrets, dead code, interrupt safety
#   extra_rule_dirs: [./standards]
#   deviations_file: ./standards/deviations.yaml
#   imports:
#     - { tool: cppcheck, path: build/cppcheck.xml }
#     - { tool: clang-analyzer, path: build/report.plist }   # also clang-tidy, clang-tidy-yaml, sarif

# Defaults for `fwlens compare` / `fwlens pr-comment` (command-line options override these).
# pr_check:
#   base: output/main-findings.json
#   base_ref: origin/main
#   fail_on_new: true
#   uncertain_gates: false          # also fail on loosely matched findings
#   max_items: 20                   # rows per table in the comment
#   base_label: "the target branch" # name used for the reference in the comment
#   report_url: https://ci.example.com/job/123/artifacts/report.html
#   max_flash_growth_bytes: 2048
#   max_ram_growth_bytes: 256
#   status: false

# How findings are matched to a baseline when code moves or is edited.
# match:
#   similarity: 0.85        # above 0, at most 1; lower follows more heavily edited code
#   report_uncertain: true  # false disables loose matching (edited code = resolved + new)

# Software bill of materials (CycloneDX 1.6 JSON). `fwlens sbom` or `output.formats: [sbom]`.
# Components are found from scope.sdk / scope.third_party_lib directories; versions and licences
# are read from the tree and marked unknown when absent. Declare what cannot be detected:
# sbom:
#   application_version: "1.4.2"        # default: git describe, else unknown
#   include_files: false                # list each source file with its SHA-256
#   components_file: sbom/components.yaml   # hand-kept parts the scan cannot see: bootloader, modem, toolchain
#   components:
#     - name: FreeRTOS
#       path: Lib/FreeRTOS              # relative to this file
#       version: "10.4.3"
#       license: MIT                    # SPDX id or expression
#       supplier: Amazon
#       purl: pkg:github/FreeRTOS/FreeRTOS-Kernel@V10.4.3
#       description: Real-time kernel

# Cryptography bill of materials (CycloneDX 1.6 JSON). `fwlens cbom` or `output.formats: [cbom]`.
# Reports the algorithms, protocols and libraries the source names; detected usage only.
# cbom:
#   scan_scopes: [first_party]          # boundary classes whose code is scanned (add sdk, third_party_lib)
#   extra_catalog_dirs: [./crypto]      # YAML catalogue files; an entry id replaces a bundled one
#   autodetect: true                    # name an unlisted identifier by its words (cy_aes_encrypt -> AES), low confidence
#   ignore_identifiers: ["debug_*"]     # identifier patterns autodetection skips
#   keywords:                           # more phrases for autodetection
#     - {match: ["zorb"], name: Zorb cipher, primitive: block-cipher}
#   apis:                               # your own function and macro names
#     - {library: cycurlib, name: AES-CBC, identifiers: [CyL_Blk_Enc], mode: cbc}
#   certificates: true                  # list certificate files, PEM/DER in source and certificate calls
#   certificate_expiry_days: 90         # warn when a certificate expires within this many days

# Architecture recovery (docs/ARCHITECTURE_RECOVERY.md): typed dependencies, components, layers and patterns,
# written to the JSON export under `architecture`.
# architecture:
#   enabled: true                       # false skips the whole stage
#   weights:                            # how strongly each kind of dependency couples two units
#     callback: 4                       #   a function address stored or passed
#     state: 3                          #   a global used, or a struct embedded in a struct
#     type: 2                           #   a type from another unit
#     call: 1                           #   a function called
#     include: 0.5                      #   a header included
#   private_headers: ["*_priv.h", "*/internal/*"]   # headers whose declarations are internal (default list shown in the guide)
#   components:                         # pin components; unpinned units are found by IDE group, then community detection
#     - {name: Comms, units: ["drivers/uart*", "drivers/spi*"]}
#   resolution: 1.0                     # community detection: higher gives smaller components
#   max_component_units: 40             # an IDE group larger than this is split by community detection
#   drift_threshold: 0.6                # list a unit when this share of its coupling is outside its directory's component
#   subsystems:                         # pin a domain to units when the names do not say
#     - {domain: comms, units: ["drivers/uart*"]}
#   domains:                            # your own domains, or replace a bundled one with the same id
#     - {id: ble, name: Bluetooth, words: [ble, gatt, gap], includes: ["nrf_ble*"]}
