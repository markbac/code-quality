name: FWLens CI Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (modules listed in pyproject.toml are a baseline to shrink)
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # No macOS runners (cost). Windows (2x minutes on private repos) runs on pushes to main only.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        python-version: ["3.14"]
    env:
      # Parser tests must run here: a missing libclang or compiler fails, a skip fails the job.
      FWLENS_REQUIRE_LIBCLANG: "1"
      FWLENS_FAIL_ON_SKIP: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies & Editable Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e packages/py-doc2slides
          pip install -e packages/py-doclint

      - name: Run Pytest Test Suite
        shell: bash
        run: |
          set -o pipefail
          pytest -rs -rfE --tb=short --cov --cov-report=term --cov-report=xml 2>&1 | tee pytest.log

      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          # one annotation holding every failure (GitHub shows only ten annotations per step)
          msgs=$(grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-230 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=pytest failures::${msgs:0:3800}"
          detail=$(grep -E '^E  ' pytest.log | cut -c1-260 | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=pytest detail::${detail:0:3800}"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: Wheel install and fixture run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean venv and run it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd tests/fixtures/action_project
          "$RUNNER_TEMP/venv/bin/fwlens" --help
          "$RUNNER_TEMP/venv/bin/fwlens" export --config config.yaml
          test -s output/exports/fwlens_results.json

  action:
    name: Composite action on a fixture project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          working-directory: tests/fixtures/action_project
          upload-report: "true"
