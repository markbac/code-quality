name: FWLens CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies & Editable Package
        run: |
          python -m pip install --upgrade pip build pytest ruff
          pip install -e ".[dev]"
          pip install -e packages/py-doc2slides
          pip install -e packages/py-doclint

      - name: Lint Codebase with Ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest --verbose

      - name: Test Package Build (wheel & sdist)
        run: |
          python -m build
