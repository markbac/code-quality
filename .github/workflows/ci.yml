name: FWLens CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (modules listed in pyproject.toml are a baseline to shrink)
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      # Parser tests must run here: a missing libclang or compiler fails, a skip fails the job.
      FWLENS_REQUIRE_LIBCLANG: "1"
      FWLENS_FAIL_ON_SKIP: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies & Editable Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e packages/py-doc2slides
          pip install -e packages/py-doclint

      - name: Run Pytest Test Suite
        run: pytest -rs --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: Wheel install and fixture run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean venv and run it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd tests/fixtures/action_project
          "$RUNNER_TEMP/venv/bin/fwlens" --help
          "$RUNNER_TEMP/venv/bin/fwlens" export --config config.yaml
          test -s output/exports/fwlens_results.json

  action:
    name: Composite action on a fixture project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          working-directory: tests/fixtures/action_project
          upload-report: "true"
