[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fwlens"
version = "0.29.0"
description = "Embedded C Architecture & Static Analysis Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "markbac", email = "markbac@github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "libclang>=16.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
    "scipy>=1.11",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    # Only needed to run the tests of packages/py-doc2slides and packages/py-doclint,
    # which the root pytest configuration collects.
    "python-pptx>=1.0.0",
    "colorlog>=6.7.0",
]

[project.scripts]
fwlens = "fwlens.cli:main"

[tool.setuptools.package-data]
fwlens = ["output/vendor/*", "output/templates/*", "standards/builtin/*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fwlens*"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/py-doc2slides/tests", "packages/py-doclint/tests"]
pythonpath = [".", "packages/py-doc2slides", "packages/py-doclint"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E701", "E722", "E731", "E741", "F401", "F821", "F841", "W292", "W293"]
