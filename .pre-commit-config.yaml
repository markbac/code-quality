# Checks run on this repository's own commits. (.pre-commit-hooks.yaml defines the hook
# that other projects use.)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^fwlens/output/templates/
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
