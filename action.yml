name: "FWLens C Quality & Architecture Check"
description: "Run static analysis, baseline gating, and inline PR annotations for Embedded C"
inputs:
  config:
    description: "Path to fwlens config.yaml, relative to working-directory"
    required: false
    default: "config.yaml"
  working-directory:
    description: "Directory to run FWLens in (config paths and output/ are relative to it)"
    required: false
    default: "."
  baseline:
    description: "Path to baseline.json. Breaches are only gated when a baseline is given."
    required: false
    default: ""
  fail-on-breach:
    description: "Fail the step if new or worsened breaches against the baseline are found"
    required: false
    default: "true"
  python-version:
    description: "Python version used to run FWLens"
    required: false
    default: "3.12"
  extra-args:
    description: "Extra arguments for 'fwlens analyze', split on spaces (for example '--jobs 2')"
    required: false
    default: ""
  upload-report:
    description: "Also build the HTML report and CSV/JSON exports and upload them as an artifact"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install FWLens
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ACTION_PATH"
    - name: Run FWLens Analysis
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FWLENS_CONFIG: ${{ inputs.config }}
        FWLENS_BASELINE: ${{ inputs.baseline }}
        FWLENS_FAIL_ON_BREACH: ${{ inputs.fail-on-breach }}
        FWLENS_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        args=(analyze --config "$FWLENS_CONFIG" --github-annotations)
        if [ -n "$FWLENS_BASELINE" ]; then
          args+=(--baseline "$FWLENS_BASELINE")
        fi
        if [ "$FWLENS_FAIL_ON_BREACH" = "true" ]; then
          args+=(--fail-on-breach)
        fi
        if [ -n "$FWLENS_EXTRA_ARGS" ]; then
          read -r -a extra <<< "$FWLENS_EXTRA_ARGS"
          args+=("${extra[@]}")
        fi
        fwlens "${args[@]}"
    - name: Build report
      if: ${{ always() && inputs.upload-report == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FWLENS_CONFIG: ${{ inputs.config }}
      run: fwlens report --config "$FWLENS_CONFIG"
    - name: Upload report
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: fwlens-report
        path: |
          ${{ inputs.working-directory }}/output/reports
          ${{ inputs.working-directory }}/output/exports
