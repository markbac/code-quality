# Built-in SEI CERT C rule set: the rules (numbers from 30 up) and a selection of the
# recommendations (00 to 29) that a tool can say something about. Ids are the public CERT
# identifiers. Titles are short original paraphrases, the full text is on the CERT wiki
# (guideline_text below).
#
# Priority levels are not carried: `category` is rule or recommendation. Rules marked
# decidable are the ones a tool can settle exactly, most CERT rules are not.
#
# How each guideline is checked is in its `check`:
#   native    a built-in check. `coverage: partial` means it finds some violations, not all, so
#             "no findings" for that guideline does not show compliance.
#   import    results from another tool, read through standards.imports and mapped by id or by
#             the tool_map at the end of this file
#   manual    needs review, FWLens lists it in the matrix as such
schema_version: 1
standard:
  id: cert-c
  name: SEI CERT C Coding Standard
  revision: "2016 edition"
  language: c
  guideline_text: https://wiki.sei.cmu.edu/confluence/display/c
  categories: [rule, recommendation]
  undeviable_categories: []
  severity_map: { rule: warning, recommendation: note }

rules:
  - id: "PRE30-C"
    kind: rule
    title: "Do not create a universal character name through concatenation"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "PRE31-C"
    kind: rule
    title: "Avoid side effects in arguments to unsafe macros"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "PRE32-C"
    kind: rule
    title: "Do not use preprocessor directives in invocations of function-like macros"
    category: rule
    decidable: true
    scope: single-tu
    check: { type: "manual" }

  - id: "DCL30-C"
    kind: rule
    title: "Declare objects with an appropriate storage duration"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    cwe: [CWE-562]
    check: { type: "native", engine: "detector", match: { name: "address_of_automatic_escapes" } }
    notes: "Finds the address of an automatic object returned or stored in a longer-lived object."

  - id: "DCL31-C"
    kind: rule
    title: "Declare identifiers before using them"
    category: rule
    decidable: true
    scope: single-tu
    check: { type: "native", engine: "diagnostic", match: { option: ["implicit-function-declaration", "implicit-int"] } }

  - id: "DCL36-C"
    kind: rule
    title: "Do not declare an identifier with conflicting linkage classifications"
    category: rule
    decidable: true
    scope: system
    coverage: partial
    check: { type: "native", engine: "diagnostic", match: { pattern: "(?:non-static declaration follows static|static declaration follows non-static)", severity: "error" } }
    notes: "Finds the conflicts clang reports within one translation unit."

  - id: "DCL37-C"
    kind: rule
    title: "Do not declare or define a reserved identifier"
    category: rule
    decidable: true
    scope: single-tu
    coverage: partial
    check:
      - { type: "native", engine: "detector", match: { name: "reserved_identifier" } }
      - { type: "native", engine: "source", match: { name: "reserved_macro_name" } }

  - id: "DCL38-C"
    kind: rule
    title: "Use the correct syntax when declaring a flexible array member"
    category: rule
    decidable: true
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "flexible_array_hack" } }
    notes: "Finds a trailing array of length 0 or 1."

  - id: "DCL39-C"
    kind: rule
    title: "Avoid information leakage when passing a structure across a trust boundary"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "DCL40-C"
    kind: rule
    title: "Do not create incompatible declarations of the same function or object"
    category: rule
    decidable: true
    scope: system
    coverage: partial
    check:
      - { type: "native", engine: "system", match: { name: "declarations_agree" } }
      - { type: "native", engine: "diagnostic", match: { pattern: "conflicting types", severity: "error" } }

  - id: "DCL41-C"
    kind: rule
    title: "Do not declare variables inside a switch before the first case label"
    category: rule
    decidable: true
    scope: single-tu
    check: { type: "native", engine: "detector", match: { name: "declaration_before_case" } }

  - id: "EXP30-C"
    kind: rule
    title: "Do not depend on the order of evaluation for side effects"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "diagnostic", match: { option: "unsequenced" } }

  - id: "EXP32-C"
    kind: rule
    title: "Do not access a volatile object through a non-volatile reference"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "cast_removes_qualifier", qualifier: "volatile" } }
    notes: "Finds explicit casts that drop volatile."

  - id: "EXP33-C"
    kind: rule
    title: "Do not read uninitialised memory"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    cwe: [CWE-457]
    check:
      - { type: "native", engine: "diagnostic", match: { option: ["uninitialized", "sometimes-uninitialized", "conditional-uninitialized"] } }
      - { type: "import" }
    notes: "Uses a native check where one is reliable and also accepts imported tool results."

  - id: "EXP34-C"
    kind: rule
    title: "Do not dereference null pointers"
    category: rule
    decidable: false
    scope: system
    cwe: [CWE-476]
    check: { type: "import" }
    notes: "Import cppcheck nullPointer or clang-analyzer core.NullDereference results."

  - id: "EXP35-C"
    kind: rule
    title: "Do not modify objects with temporary lifetime"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "EXP36-C"
    kind: rule
    title: "Do not cast pointers into more strictly aligned pointer types"
    category: rule
    decidable: true
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "cast_alignment" } }
    notes: "Finds explicit casts to a type with a larger alignment."

  - id: "EXP37-C"
    kind: rule
    title: "Call functions with the correct number and type of arguments"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check:
      - { type: "native", engine: "diagnostic", match: { option: ["incompatible-pointer-types", "int-conversion", "implicit-function-declaration"] } }
      - { type: "native", engine: "diagnostic", match: { pattern: "too (?:many|few) arguments", severity: "error" } }

  - id: "EXP39-C"
    kind: rule
    title: "Do not access a variable through a pointer of an incompatible type"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "EXP40-C"
    kind: rule
    title: "Do not modify constant objects"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check:
      - { type: "native", engine: "detector", match: { name: "cast_removes_qualifier", qualifier: "const" } }
      - { type: "native", engine: "diagnostic", match: { pattern: "read-only|const-qualified", severity: "error" } }

  - id: "EXP42-C"
    kind: rule
    title: "Do not compare padding data"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "memcmp_operand_types" } }
    notes: "Finds memcmp on structures, floating-point values and characters."

  - id: "EXP43-C"
    kind: rule
    title: "Avoid undefined behaviour when using restrict-qualified pointers"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "source", match: { pattern: "\\b(?:restrict|__restrict|__restrict__)\\b", target: "code" } }
    notes: "Reports every use of restrict for review."

  - id: "EXP44-C"
    kind: rule
    title: "Do not rely on side effects in operands to sizeof"
    category: rule
    decidable: true
    scope: single-tu
    check: { type: "native", engine: "detector", match: { name: "sizeof_side_effects" } }

  - id: "EXP45-C"
    kind: rule
    title: "Do not perform assignments in selection statements"
    category: rule
    decidable: true
    scope: single-tu
    check: { type: "native", engine: "detector", match: { name: "assignment_in_condition" } }

  - id: "EXP46-C"
    kind: rule
    title: "Do not use a bitwise operator with a Boolean-like operand"
    category: rule
    decidable: true
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "bitwise_boolean_operand" } }

  - id: "EXP47-C"
    kind: rule
    title: "Do not call va_arg with an argument of the incorrect type"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "INT30-C"
    kind: rule
    title: "Ensure that unsigned integer operations do not wrap"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    cwe: [CWE-190]
    check:
      - { type: "native", engine: "detector", match: { name: "constant_wraparound" } }
      - { type: "import" }
    notes: "Finds constant expressions that wrap. Uses a native check where one is reliable and also accepts imported tool results."

  - id: "INT31-C"
    kind: rule
    title: "Ensure that integer conversions do not lose or misinterpret data"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    check:
      - { type: "native", engine: "diagnostic", match: { option: "constant-conversion" } }
      - { type: "import" }
    notes: "Finds constants that change value on conversion. Uses a native check where one is reliable and also accepts imported tool results."

  - id: "INT32-C"
    kind: rule
    title: "Ensure that operations on signed integers do not overflow"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    cwe: [CWE-190]
    check:
      - { type: "native", engine: "diagnostic", match: { option: "integer-overflow" } }
      - { type: "import" }
    notes: "Finds constant expressions that overflow. Uses a native check where one is reliable and also accepts imported tool results."

  - id: "INT33-C"
    kind: rule
    title: "Ensure that division and remainder do not divide by zero"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    cwe: [CWE-369]
    check:
      - { type: "native", engine: "diagnostic", match: { option: "division-by-zero" } }
      - { type: "import" }
    notes: "Finds division by a constant zero. Uses a native check where one is reliable and also accepts imported tool results."

  - id: "INT34-C"
    kind: rule
    title: "Do not shift by a negative count or by the operand width or more"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    check:
      - { type: "native", engine: "detector", match: { name: "shift_range" } }
      - { type: "native", engine: "diagnostic", match: { option: ["shift-count-negative", "shift-count-overflow"] } }
    notes: "Judges constant shift counts only."

  - id: "INT35-C"
    kind: rule
    title: "Use correct integer precisions"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "INT36-C"
    kind: rule
    title: "Do not convert between a pointer and an integer"
    category: rule
    decidable: true
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "cast_pointer_integer" } }
    notes: "Checks explicit casts only."

  - id: "FLP30-C"
    kind: rule
    title: "Do not use floating-point variables as loop counters"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "float_loop_counter" } }

  - id: "FLP32-C"
    kind: rule
    title: "Prevent or detect domain and range errors in math functions"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "FLP34-C"
    kind: rule
    title: "Ensure that floating-point conversions are within range of the new type"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "FLP36-C"
    kind: rule
    title: "Preserve precision when converting integers to floating point"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "FLP37-C"
    kind: rule
    title: "Do not use object representations to compare floating-point values"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "memcmp_operand_types" } }

  - id: "ARR30-C"
    kind: rule
    title: "Do not form or use out-of-bounds pointers or array subscripts"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    cwe: [CWE-119]
    check:
      - { type: "native", engine: "detector", match: { name: "array_index_out_of_bounds" } }
      - { type: "native", engine: "diagnostic", match: { option: "array-bounds" } }
      - { type: "import" }
    notes: "Finds constant subscripts outside a fixed-size array. Uses a native check where one is reliable and also accepts imported tool results."

  - id: "ARR32-C"
    kind: rule
    title: "Ensure size arguments for variable length arrays are in a valid range"
    category: rule
    decidable: true
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "variable_length_array" } }
    notes: "Reports every variable length array for review."

  - id: "ARR36-C"
    kind: rule
    title: "Do not subtract or compare two pointers that do not refer to the same array"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "pointer_relational" } }
    notes: "Reports every relational comparison of two pointers for review."

  - id: "ARR37-C"
    kind: rule
    title: "Do not add or subtract an integer to a pointer to a non-array object"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "ARR38-C"
    kind: rule
    title: "Guarantee that library functions do not form invalid pointers"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    cwe: [CWE-119]
    check:
      - { type: "native", engine: "detector", match: { name: "string_function_bounds" } }
      - { type: "import" }
    notes: "Finds a constant size or string literal larger than the destination array. Uses a native check where one is reliable and also accepts imported tool results."

  - id: "ARR39-C"
    kind: rule
    title: "Do not add or subtract a scaled integer to a pointer"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "STR30-C"
    kind: rule
    title: "Do not attempt to modify string literals"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "string_literal_to_mutable" } }
    notes: "Finds a string literal given to a pointer to non-const char."

  - id: "STR31-C"
    kind: rule
    title: "Guarantee that storage for strings has room for the data and the terminator"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    cwe: [CWE-119]
    check: { type: "native", engine: "detector", match: { name: "string_function_bounds" } }

  - id: "STR32-C"
    kind: rule
    title: "Do not pass a non-null-terminated character sequence to a string function"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "STR34-C"
    kind: rule
    title: "Cast characters to unsigned char before converting to larger integer sizes"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "import" }
    notes: "Import clang-tidy cert-str34-c or bugprone-signed-char-misuse results."

  - id: "STR37-C"
    kind: rule
    title: "Arguments to character-handling functions must be representable as unsigned char"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "ctype_argument" } }

  - id: "STR38-C"
    kind: rule
    title: "Do not confuse narrow and wide character strings and functions"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "MEM30-C"
    kind: rule
    title: "Do not access freed memory"
    category: rule
    decidable: false
    scope: system
    cwe: [CWE-416]
    check: { type: "import" }
    notes: "Import cppcheck deallocuse and doubleFree or clang-analyzer unix.Malloc results."

  - id: "MEM31-C"
    kind: rule
    title: "Free dynamically allocated memory when no longer needed"
    category: rule
    decidable: false
    scope: system
    cwe: [CWE-401]
    check: { type: "import" }
    notes: "Import cppcheck memleak or clang-analyzer unix.Malloc results."

  - id: "MEM33-C"
    kind: rule
    title: "Allocate and copy structures containing a flexible array member dynamically"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "MEM34-C"
    kind: rule
    title: "Only free memory allocated dynamically"
    category: rule
    decidable: false
    scope: system
    coverage: partial
    cwe: [CWE-590]
    check:
      - { type: "native", engine: "detector", match: { name: "free_of_non_heap" } }
      - { type: "import" }
    notes: "Finds free applied to the address of an object or to an array. Uses a native check where one is reliable and also accepts imported tool results."

  - id: "MEM35-C"
    kind: rule
    title: "Allocate sufficient memory for an object"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "allocation_sizeof_pointer" } }
    notes: "Finds sizeof applied to the pointer that receives the allocation."

  - id: "MEM36-C"
    kind: rule
    title: "Do not modify the alignment of objects by calling realloc"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "FIO30-C"
    kind: rule
    title: "Exclude user input from format strings"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    cwe: [CWE-134]
    check: { type: "native", engine: "diagnostic", match: { option: "format-security", flags: ["-Wformat-security", "-fbuiltin"] } }
    notes: "Finds format strings that are not literals."

  - id: "FIO32-C"
    kind: rule
    title: "Do not perform operations on devices that are only appropriate for files"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "FIO34-C"
    kind: rule
    title: "Distinguish between characters read from a file and EOF or WEOF"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "import" }
    notes: "Import clang-tidy cert-fio34-c results."

  - id: "FIO37-C"
    kind: rule
    title: "Do not assume that fgets returns a nonempty string when successful"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "FIO38-C"
    kind: rule
    title: "Do not copy a FILE object"
    category: rule
    decidable: true
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "file_object_declared" } }
    notes: "Finds objects, parameters and members of type FILE."

  - id: "FIO39-C"
    kind: rule
    title: "Do not alternately input and output from a stream without flushing or positioning"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "FIO40-C"
    kind: rule
    title: "Reset strings on fgets or fgetws failure"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "FIO41-C"
    kind: rule
    title: "Do not call getc or putc with a stream argument that has side effects"
    category: rule
    decidable: true
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "stream_argument_side_effects" } }

  - id: "FIO42-C"
    kind: rule
    title: "Close files when they are no longer needed"
    category: rule
    decidable: false
    scope: system
    cwe: [CWE-404]
    check: { type: "import" }
    notes: "Import cppcheck resourceLeak results."

  - id: "FIO44-C"
    kind: rule
    title: "Only use values for fsetpos that are returned from fgetpos"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "FIO45-C"
    kind: rule
    title: "Avoid TOCTOU race conditions while accessing files"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "FIO46-C"
    kind: rule
    title: "Do not access a closed file"
    category: rule
    decidable: false
    scope: system
    cwe: [CWE-672]
    check: { type: "import" }
    notes: "Import cppcheck useClosedFile results."

  - id: "FIO47-C"
    kind: rule
    title: "Use valid format strings"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "diagnostic", match: { option: "format", flags: ["-Wformat", "-fbuiltin"] } }
    notes: "Finds the format and argument mismatches clang reports."

  - id: "ENV30-C"
    kind: rule
    title: "Do not modify the object referenced by the return value of certain functions"
    category: rule
    decidable: false
    scope: single-tu
    coverage: partial
    check: { type: "native", engine: "detector", match: { name: "const_return_used_as_mutable" } }

  - id: "ENV31-C"
    kind: rule
    title: "Do not rely on an environment pointer following an operation that may invalidate it"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "ENV32-C"
    kind: rule
    title: "All exit handlers must return normally"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "ENV33-C"
    kind: rule
    title: "Do not call system"
    category: rule
    decidable: true
    scope: single-tu
    cwe: [CWE-78]
    check: { type: "native", engine: "ast", match: { cursor: "CALL_EXPR", callee_in: ["system"] } }

  - id: "ENV34-C"
    kind: rule
    title: "Do not store pointers returned by certain functions"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "SIG30-C"
    kind: rule
    title: "Call only asynchronous-safe functions within signal handlers"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "SIG31-C"
    kind: rule
    title: "Do not access shared objects in signal handlers"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "SIG34-C"
    kind: rule
    title: "Do not call signal from within interruptible signal handlers"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "SIG35-C"
    kind: rule
    title: "Do not return from a computational exception signal handler"
    category: rule
    decidable: false
    scope: system
    check: { type: "manual" }

  - id: "ERR30-C"
    kind: rule
    title: "Take care when reading errno"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "ERR32-C"
    kind: rule
    title: "Do not rely on indeterminate values of errno"
    category: rule
    decidable: false
    scope: single-tu
    check: { type: "manual" }

  - id: "ERR33-C"
    kind: rule
    title: "Detect and handle standard library errors"
    category: rule
    decidable: false
