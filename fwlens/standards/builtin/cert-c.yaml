tool_map:
  clang-tidy:
    cert-env33-c: "ENV33-C"
    cert-msc30-c: "MSC30-C"
    clang-analyzer-core.NullDereference: "EXP34-C"
    clang-analyzer-core.uninitialized.Assign: "EXP33-C"
    clang-analyzer-core.uninitialized.Branch: "EXP33-C"
    clang-analyzer-unix.Malloc: "MEM30-C"
    clang-analyzer-unix.MismatchedDeallocator: "MEM34-C"
    clang-analyzer-security.insecureAPI.strcpy: "STR31-C"
    clang-analyzer-security.insecureAPI.rand: "MSC30-C"
    bugprone-unused-return-value: "ERR33-C"
    bugprone-signed-char-misuse: "STR34-C"
    bugprone-not-null-terminated-result: "STR32-C"
    readability-non-const-parameter: "DCL13-C"
  cppcheck:
    nullPointer: "EXP34-C"
    nullPointerRedundantCheck: "EXP34-C"
    nullPointerArithmetic: "EXP34-C"
    uninitvar: "EXP33-C"
    uninitdata: "EXP33-C"
    uninitStructMember: "EXP33-C"
    memleak: "MEM31-C"
    resourceLeak: "FIO42-C"
    useClosedFile: "FIO46-C"
    deallocuse: "MEM30-C"
    doubleFree: "MEM30-C"
    mismatchAllocDealloc: "MEM34-C"
    autovarInvalidDeallocation: "MEM34-C"
    arrayIndexOutOfBounds: "ARR30-C"
    bufferAccessOutOfBounds: "ARR38-C"
    integerOverflow: "INT32-C"
    zerodiv: "INT33-C"
    zerodivcond: "INT33-C"
    wrongPrintfScanfArgNum: "FIO47-C"
    invalidScanfFormatWidth: "FIO47-C"
    constParameter: "DCL13-C"
    constParameterPointer: "DCL13-C"
    returnLocalVariable: "DCL30-C"
    returnDanglingLifetime: "DCL30-C"
