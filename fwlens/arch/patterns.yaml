# Architecture patterns. Each pattern adds up the weights of the signals that fire (signals are named
# checks in fwlens/arch/signals.py). The score maps to a confidence: low, medium or high at the
# thresholds given. A pattern below `low` is not reported. `scope: system` patterns look at the whole
# project, `scope: subsystem` patterns at one component of the given `domain`. Add or change patterns
# with `architecture.patterns` in config.yaml (same fields; the same id replaces the bundled one).
patterns:
  - id: layered
    name: Layered
    scope: system
    signals: {layers_3plus: 2, acyclic: 2, next_layer_share_high: 2, configured_layers: 1}
    thresholds: {low: 3, medium: 5, high: 6}
  - id: hal_ports
    name: Hardware abstraction layer, ports and adapters
    scope: system
    signals: {ops_structs: 2, multiple_implementations: 3, hal_lowest: 2, dispatch_tables: 1}
    thresholds: {low: 3, medium: 5, high: 7}
  - id: super_loop
    name: Super-loop (bare metal)
    scope: system
    signals: {main_loop: 3, loop_calls_several: 2, no_rtos: 2, isrs_light: 1}
    thresholds: {low: 3, medium: 5, high: 7}
  - id: rtos_tasks
    name: RTOS task-based
    scope: system
    signals: {tasks_2plus: 3, sync_objects: 2, queue_between_tasks: 2}
    thresholds: {low: 3, medium: 5, high: 6}
  - id: event_driven
    name: Event-driven (publish and subscribe)
    scope: system
    signals: {registration_calls: 2, publish_calls: 2, event_ids: 2, dispatch_tables: 1}
    thresholds: {low: 3, medium: 4, high: 6}
  - id: state_machine_table
    name: State machine, table-driven
    scope: system
    signals: {state_machines_present: 2, several_state_machines: 2, state_tables: 3}
    thresholds: {low: 2, medium: 4, high: 6}
  - id: pipeline
    name: Pipeline (filter chain)
    scope: system
    signals: {linear_chain: 4}
    thresholds: {low: 4, medium: 4, high: 4}
  - id: plugin_registry
    name: Plugin or driver registry
    scope: system
    signals: {ops_structs: 2, multiple_implementations: 2, registration_calls: 2, dispatch_tables: 1}
    thresholds: {low: 3, medium: 5, high: 6}
  - id: big_ball_of_mud
    name: Big ball of mud (anti-pattern)
    scope: system
    signals: {many_cycles: 3, no_layering: 2, dense_dependencies: 2}
    thresholds: {low: 3, medium: 5, high: 7}
  - id: god_component
    name: God component (anti-pattern)
    scope: system
    signals: {dominant_component: 3, hub_component: 3}
    thresholds: {low: 3, medium: 4, high: 6}

  # Subsystem patterns: tested only on a component labelled with the given domain.
  - id: ui_widget_tree
    name: Retained widget tree
    scope: subsystem
    domain: ui
    signals: {widget_api: 4, input_events: 2}
    thresholds: {low: 4, medium: 4, high: 6}
  - id: ui_screen_state_machine
    name: Screen state machine
    scope: subsystem
    domain: ui
    signals: {ui_state_machine: 3, screen_table: 3}
    thresholds: {low: 3, medium: 3, high: 6}
  - id: ui_menu_table
    name: Menu table
    scope: subsystem
    domain: ui
    signals: {menu_table: 4, screen_table: 2}
    thresholds: {low: 4, medium: 4, high: 6}
  - id: ui_model_view_split
    name: Model and view split
    scope: subsystem
    domain: ui
    signals: {model_view_split: 4, input_events: 1}
    thresholds: {low: 4, medium: 4, high: 5}
  - id: ui_event_loop
    name: Event loop
    scope: subsystem
    domain: ui
    signals: {input_events: 3, queue_in_subsystem: 2, ui_state_machine: 1}
    thresholds: {low: 3, medium: 5, high: 6}
  - id: ui_display_driver_layering
    name: Display driver layering
    scope: subsystem
    domain: ui
    signals: {display_driver: 4, hal_below: 2}
    thresholds: {low: 4, medium: 4, high: 6}
  - id: comms_protocol_stack
    name: Layered protocol stack
    scope: subsystem
    domain: comms
    signals: {stack_layers: 4, parser_functions: 2}
    thresholds: {low: 4, medium: 4, high: 6}
  - id: comms_isr_ring_buffer
    name: Interrupt, ring buffer and task
    scope: subsystem
    domain: comms
    signals: {isr_ring_buffer: 4, isrs_light: 2}
    thresholds: {low: 4, medium: 4, high: 6}
  - id: comms_dma_double_buffer
    name: DMA double buffer
    scope: subsystem
    domain: comms
    signals: {dma_double_buffer: 4, isrs_light: 1}
    thresholds: {low: 4, medium: 4, high: 5}
  - id: comms_frame_parser
    name: Frame parser state machine
    scope: subsystem
    domain: comms
    signals: {unit_state_machine: 3, parser_functions: 3}
    thresholds: {low: 3, medium: 3, high: 6}
  - id: comms_command_dispatcher
    name: Command dispatcher
    scope: subsystem
    domain: comms
    signals: {command_table: 4, parser_functions: 2}
    thresholds: {low: 4, medium: 4, high: 6}
  - id: comms_task_per_interface
    name: One task per interface
    scope: subsystem
    domain: comms
    signals: {tasks_in_subsystem: 4, queue_in_subsystem: 2}
    thresholds: {low: 4, medium: 4, high: 6}
  - id: comms_gateway
    name: Gateway or bridge
    scope: subsystem
    domain: comms
    signals: {gateway_bridge: 5}
    thresholds: {low: 5, medium: 5, high: 6}
